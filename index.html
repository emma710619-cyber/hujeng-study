<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075985">
<title>戶政國考學習完整版｜科目選擇</title>
<style>
:root{color-scheme:light;--ink:#0f172a;--muted:#475569;--line:#cbd5e1;--brand:#075985;--brand2:#0e7490;--paper:#fff;--bg:#eef6f9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(145deg,#e0f2fe,#f8fafc 48%,#ecfeff);color:var(--ink);min-height:100vh}
main{width:min(1040px,calc(100% - 32px));margin:auto;padding:clamp(44px,8vw,96px) 0 48px}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid #7dd3fc;border-radius:999px;background:#f0f9ff;color:#075985;font-weight:750;font-size:14px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.05;margin:20px 0 16px;letter-spacing:-.04em}.lead{font-size:clamp(17px,2.4vw,22px);color:var(--muted);max-width:760px;line-height:1.75;margin:0 0 34px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{position:relative;display:flex;flex-direction:column;min-height:280px;padding:28px;border:1px solid rgba(148,163,184,.65);border-radius:24px;background:rgba(255,255,255,.88);box-shadow:0 18px 50px rgba(15,23,42,.09);text-decoration:none;color:inherit;transition:.2s transform,.2s box-shadow,.2s border-color}.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 24px 60px rgba(15,23,42,.16);border-color:#0ea5e9;outline:none}.tag{font-size:13px;font-weight:800;letter-spacing:.12em;color:#0369a1}.card h2{font-size:clamp(27px,4vw,39px);margin:16px 0 10px}.card p{color:var(--muted);font-size:16px;line-height:1.7;margin:0 0 24px}.go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;color:#075985;font-weight:800}.go::after{content:"→";font-size:22px}
.notice{margin-top:28px;padding:17px 20px;border:1px solid #bae6fd;border-radius:16px;background:rgba(240,249,255,.86);color:#334155;line-height:1.7}footer{margin-top:40px;color:#64748b;font-size:14px}
@media(max-width:720px){main{width:min(100% - 22px,1040px);padding-top:34px}.grid{grid-template-columns:1fr}.card{min-height:230px;padding:23px}}
</style>
</head>
<body data-build="V1-07C">
<main>
  <div class="badge">戶政國考學習完整版 · V1-07C</div>
  <h1>選擇學習科目</h1>
  <p class="lead">兩科分開保存學習進度，並使用不同的 Service Worker scope 與快取前綴，避免更新其中一科時清除另一科的離線資料。</p>
  <section class="grid" aria-label="科目列表">
    <a class="card" id="admin-law-card" href="./administrative-law/">
      <span class="tag">SUBJECT 01</span><h2>行政法</h2>
      <p>行政法教材、章節題庫、歷屆試題、錯題與學習進度。</p><span class="go">進入行政法</span>
    </a>
    <a class="card" id="nationality-card" href="./nationality-household/">
      <span class="tag">SUBJECT 02</span><h2>國籍與戶政法規概要</h2>
      <p>800題章節題庫，以及110年至114年普通考試、地方特考四等共10卷。</p><span class="go">進入國籍與戶政法規</span>
    </a>
  </section>
  <div class="notice" id="legacy-cleanup-status">正在檢查舊版根目錄 Service Worker；只會移除舊根目錄註冊，不影響兩個科目的獨立註冊。</div>
  <footer>戶政國考學習完整版｜雙科目入口｜V1-07C</footer>
</main>
<script>
(async()=>{
 const status=document.getElementById('legacy-cleanup-status');
 if(!('serviceWorker' in navigator)){status.textContent='瀏覽器不支援 Service Worker；仍可使用線上版。';return;}
 try{
  const rootScope=new URL('./',location.href).href;
  const regs=await navigator.serviceWorker.getRegistrations();
  const roots=regs.filter(r=>r.scope===rootScope);
  await Promise.all(roots.map(r=>r.unregister()));
  if('caches' in window){
   const keys=await caches.keys();
   const legacy=keys.filter(k=>/^hujeng-v\d+/i.test(k)||k==='hujeng-v47-title-20260730');
   await Promise.all(legacy.map(k=>caches.delete(k)));
  }
  status.textContent=roots.length?'已移除舊版根目錄 Service Worker；兩科將各自管理離線快取。':'未發現舊版根目錄 Service Worker；雙科目隔離架構正常。';
 }catch(err){status.textContent='舊版快取自動清理未完成；不影響線上使用。可重新整理後再試。';console.warn(err);}
})();
</script>
</body></html>
